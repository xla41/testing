<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G Gutierrez Remodeling & Construction</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

/* Top header */
.header {
  text-align: center;
  padding: 40px 20px 20px;
  background: white;
}

.logo {
  max-width: 160px;
  margin-bottom: 10px;
}

.phone-top {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
  color: #333;
}

.company-name {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* Section layout */
.section {
  max-width: 1100px;
  margin: auto;
  padding: 60px 20px;
}

/* Before/After blocks */
.ba-block {
  display: flex;
  gap: 20px;
  margin-bottom: 60px;
  align-items: center;
}

.ba-block:nth-child(even) {
  flex-direction: row-reverse;
}

.ba-img {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.ba-img img {
  width: 100%;
  height: 320px;
  object-fit: cover;
  border-radius: 8px;
}

/* Labels */
.label {
  text-align: center;
  margin-top: 8px;
  font-weight: bold;
  color: #555;
}

/* Footer */
footer {
  background: white;
  text-align: center;
  padding: 40px 20px;
  margin-top: 40px;
  border-top: 1px solid #ddd;
}

footer p {
  margin: 5px 0;
  color: #333;
}

/* Mobile */
@media (max-width: 768px) {
  .ba-block {
    flex-direction: column !important;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <!-- LOGO (replace src later) -->
  <img class="logo" src="https://via.placeholder.com/160x80?text=LOGO" alt="Company Logo">

  <div class="phone-top">Call Now: (123) 456-7890</div>

  <div class="company-name">A.G Gutierrez Remodeling & Construction</div>

</div>

<!-- BEFORE / AFTER GALLERY -->
<div class="section">

  <!-- 1 -->
  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1501183638710-841dd1904471" alt="Before 1">
      <div class="label">Before</div>
    </div>
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511" alt="After 1">
      <div class="label">After</div>
    </div>
  </div>

  <!-- 2 -->
  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858" alt="Before 2">

    </div>

      <img src="https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6" alt="After 2">
      <div class="label">After</div>
    </div>
  </div>

  <!-- 3 -->

    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae" alt="Before 3">

    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c" alt="After 3">
      <div class="label">After</div>
    </div>
  </div>

  <!-- 4 -->
  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1493809842364-78817add7ffb" alt="Before 4">
      <div class="label">Before</div>
    </div>

      <img src="https://images.unsplash.com/photo-1600607687644-c7171b42498f" alt="After 4">

    </div>
  </div>

  <!-- 5 -->

      <img src="https://images.unsplash.com/photo-1503387762-592deb58ef4e" alt="Before 5">
      <div class="label">Before</div>
    </div>
    <div class="ba-img">

</div>

<!-- FOOTER -->
<footer>

</body>
</html>
