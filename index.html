<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      line-height: 1.6;
      color: #333;
    }

    header {
      background: #111;
      color: #fff;
      padding: 15px 20px;
      position: sticky;
      top: 0;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 15px;
    }

    .hero {
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: white;
      padding: 20px;
    }

    .hero h1 {
      font-size: 3rem;
    }

    .section {
      padding: 60px 20px;
      max-width: 900px;
      margin: auto;
    }

    .section h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .about, .contact {
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      margin: auto;
    }

    input, textarea {
      padding: 10px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <nav>
    <div><strong>YourSite</strong></div>
    <div>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h1>Welcome to Your Website</h1>
    <p>This is your new website. Customize it however you want.</p>
  </div>
</section>

<section class="section about" id="about">
  <h2>About</h2>
  <p>Write about yourself or your business here. Explain what you do and why it matters.</p>
</section>

<section class="section contact" id="contact">
  <h2>Contact</h2>
  <form onsubmit="handleSubmit(event)">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Your Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<footer>
  <p>© 2026 Your Website</p>
</footer>

<script>
  function handleSubmit(e) {
    e.preventDefault();
    alert("Message sent! (This is a demo form)");
  }
</script>

</body>
</html>
