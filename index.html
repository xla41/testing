<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G Gutierrez Remodeling & Construction</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #2b2b2b;
  color: #f2f2f2;
}

/* Make ALL links white */
a {
  color: #ffffff;
  text-decoration: none;
}

/* HEADER */
.header {
  text-align: center;
  padding: 40px 20px 20px;
  background: #3a3a3a;
}

.logo {
  max-width: 150px;
  margin-bottom: 10px;
}

.phone-top {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.company-name {
  font-size: 24px;
  font-weight: 600;
}

/* SECTION */
.section {
  max-width: 1000px;
  margin: auto;
  padding: 50px 15px;
}

/* BEFORE / AFTER BLOCK (NO BORDERS NOW) */
.ba-block {
  display: flex;
  gap: 12px;
  margin-bottom: 45px;
  align-items: center;
  background: none; /* removed box */
  padding: 0;       /* removed padding */
}

/* IMAGE CONTAINERS */
.ba-img {
  flex: 1;
}

/* BIGGER IMAGES */
.ba-img img {
  width: 100%;
  height: 320px; /* bigger again */
  object-fit: cover;
  border-radius: 6px;
  display: block;
}

/* FOOTER */
footer {
  background: #3a3a3a;
  text-align: center;
  padding: 40px 20px;
}

footer p {
  margin: 5px 0;
}

/* MOBILE */
@media (max-width: 768px) {
  .ba-img img {
    height: 220px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <img class="logo" src="https://via.placeholder.com/150x80?text=LOGO" alt="Logo">

  <div class="phone-top">Call Now: (123) 456-7890</div>

  <div class="company-name">A.G Gutierrez Remodeling & Construction</div>

</div>
