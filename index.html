<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G Gutierrez Remodeling & Construction</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #d9d9d9; /* overall gray theme */
  color: #111;
}

/* HEADER (no white anymore) */
.header {
  text-align: center;
  padding: 40px 20px 20px;
  background: #cfcfcf;
}

.logo {
  max-width: 160px;
  margin-bottom: 10px;
}

.phone-top {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.company-name {
  font-size: 26px;
  font-weight: 600;
}

/* SECTION */
.section {
  max-width: 1100px;
  margin: auto;
  padding: 60px 20px;
}

/* BEFORE / AFTER BLOCK */
.ba-block {
  display: flex;
  gap: 15px;
  margin-bottom: 50px;
  padding: 15px;
  background: #bfbfbf; /* darker gray card */
  border-radius: 10px;
  align-items: stretch;
}

.ba-img {
  flex: 1;
}

.ba-img img {
  width: 100%;
  height: 360px;
  object-fit: cover;
  border-radius: 8px;
  display: block;
}

/* FOOTER (also gray, not white) */
footer {
  background: #cfcfcf;
  text-align: center;
  padding: 40px 20px;
}

footer p {
  margin: 5px 0;
}

/* 📱 MOBILE */
@media (max-width: 768px) {
  .ba-block {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .ba-img {
    flex: 0 0 85%;
  }

  .ba-img img {
    height: 250px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <img class="logo" src="https://via.placeholder.com/160x80?text=LOGO" alt="Logo">

  <div class="phone-top">Call Now: (123) 456-7890</div>

  <div class="company-name">A.G Gutierrez Remodeling & Construction</div>

</div>

<!-- GALLERY -->
<div class="section">

  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1501183638710-841dd1904471">
    </div>
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511">
    </div>
  </div>

  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858">
    </div>
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6">
    </div>
  </div>

  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae">
    </div>
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
    </div>
  </div>

  <div class="ba-block">

      <img src="https://images.unsplash.com/photo-1493809842364-78817add7ffb">

      <img src="https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea">

</div>

<!-- FOOTER -->
<footer>
  <p><strong>Call:</strong> (123) 456-7890</p>
  <p><strong>Email:</strong> your@email.com</p>
  <p><strong>Address:</strong> Your Business Address</p>
</footer>

</body>
</html>
