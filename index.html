<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.G Gutierrez Remodeling & Construction</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e9e9e9; /* light gray overall */
  color: #111;
}

/* Header */
.header {
  text-align: center;
  padding: 40px 20px 20px;
  background: #f5f5f5;
}

.logo {
  max-width: 160px;
  margin-bottom: 10px;
}

.phone-top {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.company-name {
  font-size: 26px;
  font-weight: 600;
}

/* Gallery sections */
.section {
  max-width: 1100px;
  margin: auto;
  padding: 60px 20px;
}

/* darker gray blocks for contrast */
.ba-block {
  display: flex;
  gap: 15px;
  margin-bottom: 50px;
  padding: 15px;
  background: #d6d6d6; /* darker gray block */
  border-radius: 10px;
  align-items: stretch;
}

.ba-block:nth-child(even) {
  flex-direction: row-reverse;
}

.ba-img {
  flex: 1;
}

.ba-img img {
  width: 100%;
  height: 360px;
  object-fit: cover;
  border-radius: 8px;
  display: block;
}

/* Footer */
footer {
  background: #f5f5f5;
  text-align: center;
  padding: 40px 20px;
  margin-top: 40px;
}

footer p {
  margin: 5px 0;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
  .ba-block {
    flex-direction: column !important;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <img class="logo" src="https://via.placeholder.com/160x80?text=LOGO" alt="Logo">

  <div class="phone-top">Call Now: (123) 456-7890</div>

  <div class="company-name">A.G Gutierrez Remodeling & Construction</div>

</div>

<!-- GALLERY -->
<div class="section">

  <!-- 1 -->
  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1501183638710-841dd1904471" alt="Project 1 Before">
    </div>
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511" alt="Project 1 After">
    </div>
  </div>

  <!-- 2 -->
  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858" alt="Project 2 Before">
    </div>
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6" alt="Project 2 After">
    </div>
  </div>

  <!-- 3 -->
  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae" alt="Project 3 Before">
    </div>
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c" alt="Project 3 After">
    </div>
  </div>

  <!-- 4 -->
  <div class="ba-block">
    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1493809842364-78817add7ffb" alt="Project 4 Before">

    <div class="ba-img">
      <img src="https://images.unsplash.com/photo-1600607687644-c7171b42498f" alt="Project 4 After">

  </div>

  <!-- 5 -->
  <div class="ba-block">
    <div class="ba-img">

      <img src="https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea" alt="Project 5 After">
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer>
  <p><strong>Call:</strong> (123) 456-7890</p>
  <p><strong>Email:</strong> your@email.com</p>

</body>
</html>
